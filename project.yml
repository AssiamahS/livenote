name: LiveNote
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: QGMAWHX827
    CODE_SIGN_STYLE: Automatic

targets:
  LiveNote:
    type: application
    platform: iOS
    sources:
      - LiveNote
      - Shared
    dependencies:
      - target: LiveNoteWidgets
    info:
      path: LiveNote/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: LiveNote
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.livenote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  LiveNoteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LiveNoteWidgets
      - Shared
    info:
      path: LiveNoteWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: LiveNote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.livenote.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

schemes:
  LiveNote:
    build:
      targets:
        LiveNote: all
    run:
      config: Debug
